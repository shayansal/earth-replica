[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-replica"
version = "0.1.0"
description = "A Genesis-backed foundation for a global 4D live illustration and simulation of Earth."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Earth Replica contributors" }]
keywords = [
  "simulation",
  "genesis",
  "world-model",
  "digital-twin",
  "earth",
  "iot",
  "edge-computing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
genesis = ["genesis-world"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/shayansal/earth-replica"
Repository = "https://github.com/shayansal/earth-replica"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
